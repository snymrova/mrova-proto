<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shape Band</title>
<style>
  :root{
    --night-1:#2B1B54;
    --night-2:#4A2C7A;
    --amber:#FFB627;
    --cream:#FFF6E9;
    --pink:#FF5DA2;
    --blue:#36D1FF;
    --lime:#8BE04A;
    --tangerine:#FF8C42;
    --grape:#B06CFF;
    --beat-glow: rgba(255,182,39,0);
    --display: 'Baloo 2','Fredoka','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap');

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{
    font-family:var(--display);
    background:#1a1033;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  #stage{
    position:fixed; inset:0;
    background:
      radial-gradient(120% 80% at 50% 120%, rgba(255,182,39,0.28), transparent 60%),
      radial-gradient(90% 70% at 50% -10%, rgba(176,108,255,0.30), transparent 70%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 100%);
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* soft stage spotlights */
  #stage::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(40% 60% at 20% 0%, rgba(54,209,255,0.10), transparent 70%),
      radial-gradient(40% 60% at 80% 0%, rgba(255,93,162,0.10), transparent 70%);
  }

  /* ---------- top bar ---------- */
  #topbar{
    position:relative; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:14px 16px;
  }
  #promptCard{
    display:flex; align-items:center; gap:14px;
    background:rgba(255,246,233,0.10);
    border:2px solid rgba(255,246,233,0.18);
    border-radius:22px;
    padding:10px 18px 10px 12px;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 22px rgba(0,0,0,0.25);
    flex:1; min-width:0;
  }
  #promptIcon{ width:54px; height:54px; flex:0 0 auto; filter:drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  #promptText{
    color:var(--cream); font-weight:800;
    font-size:clamp(18px, 4.6vw, 30px);
    line-height:1.05; letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #scoreWrap{
    display:flex; align-items:center; gap:7px;
    color:var(--amber); font-weight:800;
    font-size:clamp(20px,5vw,30px);
    background:rgba(0,0,0,0.18);
    padding:8px 14px; border-radius:18px;
    flex:0 0 auto;
  }
  #scoreStar{ font-size:1.1em; filter:drop-shadow(0 0 6px rgba(255,182,39,.6)); }

  /* meter lights */
  #meter{
    position:relative; z-index:5;
    display:flex; justify-content:center; gap:10px;
    padding:2px 0 6px;
  }
  .light{
    width:clamp(20px,5.5vw,30px); height:clamp(20px,5.5vw,30px);
    border-radius:50%;
    background:rgba(255,246,233,0.12);
    border:2px solid rgba(255,246,233,0.22);
    transition:transform .18s ease;
  }
  .light.on{
    background:radial-gradient(circle at 35% 30%, #fff, var(--amber) 65%);
    border-color:var(--amber);
    box-shadow:0 0 16px var(--amber);
    transform:scale(1.15);
  }

  /* ---------- play area ---------- */
  #play{ position:relative; flex:1; z-index:3; }
  .shape{
    position:absolute; width:90px; height:90px;
    transform:translate(-50%,-50%);
    cursor:pointer; will-change:transform, top;
  }
  .shape svg{ width:100%; height:100%; display:block;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,0.30)); }
  .shape.pop{ animation:pop .36s ease-out forwards; pointer-events:none; }
  @keyframes pop{
    0%{ transform:translate(-50%,-50%) scale(1); }
    40%{ transform:translate(-50%,-50%) scale(1.45); }
    100%{ transform:translate(-50%,-50%) scale(1.8); opacity:0; }
  }
  .shape.wobble{ animation:wobble .4s ease; }
  @keyframes wobble{
    0%,100%{ transform:translate(-50%,-50%) rotate(0); }
    25%{ transform:translate(-50%,-50%) rotate(-11deg); }
    75%{ transform:translate(-50%,-50%) rotate(11deg); }
  }

  /* footlights */
  #footlights{
    position:relative; z-index:4; height:18px;
    background:linear-gradient(180deg, transparent, rgba(255,182,39,0.0));
    display:flex; justify-content:space-around; align-items:flex-end;
    padding:0 12px 6px;
  }
  .foot{
    width:14px; height:14px; border-radius:50% 50% 6px 6px;
    background:radial-gradient(circle at 50% 30%, #fff, var(--amber) 70%);
    box-shadow:0 0 12px var(--amber);
    opacity:.85;
  }

  /* sparkles & confetti */
  .spark{ position:absolute; z-index:6; pointer-events:none;
    font-size:22px; will-change:transform,opacity; }
  .confetti{ position:absolute; top:-20px; z-index:20; width:13px; height:18px;
    border-radius:3px; pointer-events:none; will-change:transform,opacity; }

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:radial-gradient(80% 60% at 50% 40%, rgba(43,27,84,0.72), rgba(26,16,51,0.92));
    backdrop-filter:blur(4px);
  }
  .overlay.hidden{ display:none; }
  #title{
    font-weight:800; color:var(--cream);
    font-size:clamp(46px,14vw,86px); line-height:.95;
    margin:0 0 6px; letter-spacing:1px;
    text-shadow:0 6px 0 rgba(176,108,255,.55), 0 12px 26px rgba(0,0,0,.5);
  }
  #title .b{ color:var(--blue); } #title .p{ color:var(--pink); }
  #titleRow{ display:flex; gap:10px; margin:14px 0 26px; }
  #titleRow svg{ width:clamp(40px,11vw,64px); height:clamp(40px,11vw,64px);
    animation:bob 1.6s ease-in-out infinite; }
  #titleRow svg:nth-child(2){ animation-delay:.2s }
  #titleRow svg:nth-child(3){ animation-delay:.4s }
  #titleRow svg:nth-child(4){ animation-delay:.6s }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

  .bigbtn{
    font-family:var(--display); font-weight:800;
    font-size:clamp(26px,7vw,40px); color:#3a1d00;
    background:linear-gradient(180deg,#FFD25E,var(--amber));
    border:none; border-radius:50px;
    padding:18px 56px; cursor:pointer;
    box-shadow:0 8px 0 #c97f12, 0 14px 30px rgba(0,0,0,.4);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .bigbtn:active{ transform:translateY(6px); box-shadow:0 2px 0 #c97f12, 0 6px 16px rgba(0,0,0,.4); }
  .grownup{
    color:rgba(255,246,233,0.78); font-family:'Fredoka',var(--display);
    font-weight:500; font-size:clamp(13px,3.4vw,16px);
    max-width:440px; margin:26px auto 0; line-height:1.5;
  }
  #encoreText{
    font-weight:800; color:var(--cream);
    font-size:clamp(40px,12vw,72px);
    text-shadow:0 5px 0 var(--pink), 0 10px 24px rgba(0,0,0,.5);
    animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes popIn{ 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }

  /* sound toggle */
  #soundBtn{
    position:absolute; top:14px; right:14px; z-index:40;
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,246,233,0.14); border:2px solid rgba(255,246,233,0.22);
    color:var(--cream); font-size:22px; cursor:pointer; display:none;
    align-items:center; justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    #titleRow svg, .foot{ animation:none !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <div id="promptCard">
      <div id="promptIcon"></div>
      <div id="promptText">Get ready!</div>
    </div>
    <div id="scoreWrap"><span id="scoreStar">⭐</span><span id="score">0</span></div>
  </div>
  <div id="meter"></div>
  <div id="play"></div>
  <div id="footlights"></div>

  <button id="soundBtn" aria-label="Toggle sound">🔊</button>

  <!-- Start overlay -->
  <div class="overlay" id="startOverlay">
    <h1 id="title"><span class="b">Shape</span> <span class="p">Band</span></h1>
    <div id="titleRow"></div>
    <button class="bigbtn" id="playBtn">Play</button>
    <p class="grownup">A pop-to-the-beat game for little hands (ages 4-7). It teaches shapes by name, then nudges toward their corners. A friendly voice reads everything aloud. No timers, no losing — just tap and play.</p>
  </div>

  <!-- Encore overlay -->
  <div class="overlay hidden" id="encoreOverlay">
    <div id="encoreText">Encore!</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- shape drawing ---------------- */
  function starPoints(cx,cy,outer,inner,n){
    let p=[]; const step=Math.PI/n;
    for(let i=0;i<2*n;i++){
      const r=(i%2===0)?outer:inner;
      const a=i*step - Math.PI/2;
      p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));
    }
    return p.join(" ");
  }
  const FACE = `
    <g fill="#2a1840">
      <circle cx="40" cy="50" r="5.5"/>
      <circle cx="60" cy="50" r="5.5"/>
    </g>
    <path d="M40 61 Q50 70 60 61" stroke="#2a1840" stroke-width="4.5"
      fill="none" stroke-linecap="round"/>`;
  function body(type,color){
    const s=`stroke="rgba(0,0,0,.18)" stroke-width="3" stroke-linejoin="round"`;
    switch(type){
      case 'circle':    return `<circle cx="50" cy="50" r="42" fill="${color}" ${s}/>`;
      case 'square':    return `<rect x="11" y="11" width="78" height="78" rx="13" fill="${color}" ${s}/>`;
      case 'rectangle': return `<rect x="6" y="24" width="88" height="52" rx="13" fill="${color}" ${s}/>`;
      case 'triangle':  return `<polygon points="50,12 90,84 10,84" fill="${color}" ${s} stroke-linejoin="round"/>`;
      case 'star':      return `<polygon points="${starPoints(50,52,44,19,5)}" fill="${color}" ${s}/>`;
      case 'heart':     return `<path d="M50 86 C8 56 14 22 38 22 C48 22 50 33 50 33 C50 33 52 22 62 22 C86 22 92 56 50 86 Z" fill="${color}" ${s}/>`;
      case 'hexagon':   return `<polygon points="50,10 86,30 86,70 50,90 14,70 14,30" fill="${color}" ${s}/>`;
      case 'diamond':   return `<polygon points="50,8 90,50 50,92 10,50" fill="${color}" ${s}/>`;
    }
    return "";
  }
  function svgFor(type,color){
    return `<svg viewBox="0 0 100 100">${body(type,color)}${FACE}</svg>`;
  }

  const COLORS=['#FF5DA2','#36D1FF','#8BE04A','#FF8C42','#B06CFF','#FFD25E'];
  const rc=()=>COLORS[(Math.random()*COLORS.length)|0];

  /* ---------------- rounds (the learning ladder) ---------------- */
  const ALL=['circle','square','triangle','star','heart','rectangle','hexagon','diamond'];
  const ROUNDS=[
    {test:t=>t==='circle',   icon:'circle',   prompt:'Tap the circles!',  spawn:['circle','square','triangle','star']},
    {test:t=>t==='square',   icon:'square',   prompt:'Tap the squares!',  spawn:['square','circle','heart','triangle']},
    {test:t=>t==='triangle', icon:'triangle', prompt:'Tap the triangles!',spawn:['triangle','circle','star','square']},
    {test:t=>t==='star',     icon:'star',     prompt:'Tap the stars!',    spawn:['star','heart','circle','square']},
    {test:t=>t==='heart',    icon:'heart',    prompt:'Tap the hearts!',   spawn:['heart','star','circle','triangle']},
    {test:t=>t==='triangle', icon:'triangle', prompt:'Tap shapes with 3 corners!', spawn:['triangle','square','circle','star'], hint:true},
    {test:t=>t==='square',   icon:'square',   prompt:'Tap shapes with 4 corners!', spawn:['square','triangle','circle','hexagon'], hint:true},
  ];
  const GOAL=6; // correct taps per round

  /* ---------------- audio ---------------- */
  let AC=null, master=null, soundOn=true;
  function initAudio(){
    if(AC) return;
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain(); master.gain.value=0.32; master.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  function tone(freq,dur,type,vol,when){
    if(!AC||!soundOn) return;
    const t=when||AC.currentTime;
    const o=AC.createGain(); o.connect(master);
    const osc=AC.createOscillator(); osc.type=type||'triangle';
    osc.frequency.value=freq; osc.connect(o);
    o.gain.setValueAtTime(0.0001,t);
    o.gain.exponentialRampToValueAtTime(vol||0.3,t+0.01);
    o.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.start(t); osc.stop(t+dur+0.02);
  }
  function kick(){ tone(150,0.16,'sine',0.28); }
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
  function correctSound(combo){ tone(PENTA[Math.min(combo,PENTA.length-1)],0.32,'triangle',0.32); }
  function wrongSound(){ tone(150,0.18,'square',0.18); }
  function encoreSound(){
    if(!AC) return; const base=AC.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.3,'triangle',0.3,base+i*0.12));
  }

  /* speech */
  let voice=null;
  function pickVoice(){
    const vs=speechSynthesis.getVoices();
    voice = vs.find(v=>/female|samantha|karen|tessa|zira|google us/i.test(v.name))
         || vs.find(v=>/en[-_]/i.test(v.lang)) || vs[0] || null;
  }
  if('speechSynthesis' in window){
    pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;
  }
  function say(text){
    if(!soundOn || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=0.95; u.pitch=1.25; if(voice) u.voice=voice;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  const PRAISE=['Yay!','Nice!','Wow!','Yes!','Woohoo!','Great!'];

  /* ---------------- game state ---------------- */
  const play=document.getElementById('play');
  const promptText=document.getElementById('promptText');
  const promptIcon=document.getElementById('promptIcon');
  const scoreEl=document.getElementById('score');
  const meter=document.getElementById('meter');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let shapes=[], roundIdx=0, roundHits=0, score=0, combo=0;
  let running=false, lastT=0, spawnTimer=0, beatTimer=0;
  const BEAT=0.6; // seconds (~100 bpm)

  // build meter lights
  for(let i=0;i<GOAL;i++){ const d=document.createElement('div'); d.className='light'; meter.appendChild(d); }
  const lights=[...meter.children];
  // footlights
  const fl=document.getElementById('footlights');
  for(let i=0;i<14;i++){ const f=document.createElement('div'); f.className='foot'; fl.appendChild(f); }
  // title shapes
  const tr=document.getElementById('titleRow');
  ['circle','triangle','star','square'].forEach(t=>{
    const d=document.createElement('div'); d.innerHTML=svgFor(t,rc()); tr.appendChild(d.firstChild);
  });

  function setRound(i){
    const r=ROUNDS[i%ROUNDS.length];
    roundHits=0; lights.forEach(l=>l.classList.remove('on'));
    promptText.textContent=r.prompt;
    promptIcon.innerHTML=svgFor(r.icon, '#FFD25E');
    say(r.prompt);
  }

  function spawn(){
    const r=ROUNDS[roundIdx%ROUNDS.length];
    const pool=r.spawn;
    // bias toward target so young kids always have something to tap
    let type;
    if(Math.random()<0.5){ type=pool.find(t=>r.test(t)) || pool[0]; }
    else { type=pool[(Math.random()*pool.length)|0]; }
    const el=document.createElement('div');
    el.className='shape';
    el.innerHTML=svgFor(type,rc());
    const W=play.clientWidth;
    const s={el,type,x:40+Math.random()*(W-80),y:play.clientHeight+60,
             vy:46+Math.random()*22+roundIdx*2, scale:1, baseRot:(Math.random()*16-8)};
    el.style.left=s.x+'px'; el.style.top=s.y+'px';
    el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); hit(s); });
    play.appendChild(el); shapes.push(s);
  }

  function hit(s){
    if(s.dead) return;
    const r=ROUNDS[roundIdx%ROUNDS.length];
    if(r.test(s.type)){
      s.dead=true; combo++;
      correctSound(combo);
      s.el.classList.add('pop');
      sparkle(s.x,s.y);
      setTimeout(()=>{ s.el.remove(); }, 360);
      shapes=shapes.filter(o=>o!==s);
      score++; scoreEl.textContent=score;
      roundHits++;
      if(roundHits<=GOAL) lights[roundHits-1] && lights[roundHits-1].classList.add('on');
      if(Math.random()<0.4) say(PRAISE[(Math.random()*PRAISE.length)|0]);
      if(roundHits>=GOAL) encore();
    } else {
      combo=0; wrongSound();
      s.el.classList.remove('wobble'); void s.el.offsetWidth;
      s.el.classList.add('wobble');
    }
  }

  function sparkle(x,y){
    const emojis=['✨','⭐','💫','🌟'];
    const n=reduceMotion?3:7;
    for(let i=0;i<n;i++){
      const sp=document.createElement('div'); sp.className='spark';
      sp.textContent=emojis[(Math.random()*emojis.length)|0];
      sp.style.left=x+'px'; sp.style.top=y+'px';
      play.appendChild(sp);
      const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-30;
      sp.animate([
        {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
        {transform:`translate(${dx-50}%,${dy-50}%) scale(1.3)`,opacity:0}
      ],{duration:650+Math.random()*250,easing:'ease-out'}).onfinish=()=>sp.remove();
    }
  }

  function encore(){
    running=false;
    encoreSound();
    say('Encore! Amazing!');
    confetti();
    const ov=document.getElementById('encoreOverlay');
    ov.classList.remove('hidden');
    setTimeout(()=>{
      ov.classList.add('hidden');
      roundIdx++; setRound(roundIdx);
      running=true; lastT=performance.now();
      requestAnimationFrame(loop);
    }, 2200);
  }

  function confetti(){
    const n=reduceMotion?16:60;
    for(let i=0;i<n;i++){
      const c=document.createElement('div'); c.className='confetti';
      c.style.background=rc();
      c.style.left=(20+Math.random()*60)+'%';
      document.getElementById('stage').appendChild(c);
      const dx=(Math.random()*2-1)*40, rot=Math.random()*720;
      c.animate([
        {transform:`translate(0,-20px) rotate(0)`,opacity:1},
        {transform:`translate(${dx}vw, 110vh) rotate(${rot}deg)`,opacity:1}
      ],{duration:1800+Math.random()*900,easing:'cubic-bezier(.3,.6,.5,1)'}).onfinish=()=>c.remove();
    }
  }

  function loop(now){
    if(!running) return;
    const dt=Math.min((now-lastT)/1000,0.05); lastT=now;

    // beat
    beatTimer-=dt;
    if(beatTimer<=0){
      beatTimer+=BEAT; kick();
      const bump=reduceMotion?1.05:1.16;
      shapes.forEach(s=>{ if(!s.dead) s.scale=bump; });
      lights.forEach(l=>{ l.style.transform='scale(1.12)'; setTimeout(()=>l.style.transform='',140); });
    }

    // spawn
    spawnTimer-=dt;
    if(spawnTimer<=0 && shapes.length<11){
      spawnTimer = 0.7 + Math.random()*0.5;
      spawn();
    }

    // move + ease scale
    for(let i=shapes.length-1;i>=0;i--){
      const s=shapes[i]; if(s.dead) continue;
      s.y-=s.vy*dt;
      s.scale += (1-s.scale)*Math.min(1,dt*10);
      s.el.style.top=s.y+'px';
      s.el.style.transform=`translate(-50%,-50%) scale(${s.scale.toFixed(3)}) rotate(${s.baseRot}deg)`;
      if(s.y < -70){ s.el.remove(); shapes.splice(i,1); }
    }
    requestAnimationFrame(loop);
  }

  /* ---------------- start ---------------- */
  function startGame(){
    initAudio();
    if(AC && AC.state==='suspended') AC.resume();
    say('Shape Band! Lets play!');
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('soundBtn').style.display='flex';
    roundIdx=0; score=0; combo=0; scoreEl.textContent='0';
    setRound(0);
    running=true; lastT=performance.now(); beatTimer=0; spawnTimer=0.3;
    requestAnimationFrame(loop);
  }
  document.getElementById('playBtn').addEventListener('click',startGame);

  const sb=document.getElementById('soundBtn');
  sb.addEventListener('click',()=>{
    soundOn=!soundOn; sb.textContent=soundOn?'🔊':'🔇';
    if(!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  });
})();
</script>
</body>
</html>
